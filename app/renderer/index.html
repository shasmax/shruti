<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shruti</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand">shruti</div>
          <button id="collapse-btn" class="icon-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="3" width="12" height="10" rx="1.5"/>
              <line x1="6" y1="3" x2="6" y2="13"/>
            </svg>
          </button>
        </div>

        <button id="record-btn" class="record-btn" title="Record meeting">
          <span class="record-dot"></span>
          <span class="record-label">Record meeting</span>
        </button>
        <div id="recording-status" class="recording-status hidden"></div>

        <div class="sidebar-divider sidebar-collapsable"></div>

        <div class="sidebar-section-row sidebar-collapsable">
          <span class="sidebar-section-label">Folders</span>
          <button id="new-folder-btn" class="icon-btn small" title="New folder" aria-label="New folder">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <line x1="8" y1="3" x2="8" y2="13"/>
              <line x1="3" y1="8" x2="13" y2="8"/>
            </svg>
          </button>
        </div>
        <div id="folder-pills" class="folder-pills sidebar-collapsable"></div>

        <div class="sidebar-section-row sidebar-collapsable" style="margin-top: 12px;">
          <span class="sidebar-section-label">Meetings</span>
        </div>
        <div id="meetings-list" class="meetings-list sidebar-collapsable">
          <div class="empty">no meetings yet</div>
        </div>

        <div class="sidebar-footer">
          <button id="settings-btn" class="footer-btn" title="Settings">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span class="footer-label">Settings</span>
          </button>
        </div>
      </aside>

      <div id="popover" class="popover hidden" role="menu">
        <button class="popover-item" data-action="rename">Rename</button>
        <button class="popover-item" data-action="move">Move to folder…</button>
        <button class="popover-item danger" data-action="delete">Delete</button>
      </div>

      <dialog id="move-dialog" class="settings-dialog">
        <form method="dialog">
          <h2>Move to folder</h2>
          <div id="move-folders" class="move-folders"></div>
          <label>
            <span>Or new folder</span>
            <input id="new-folder-name" type="text" placeholder="e.g. Acme Q3 planning" />
          </label>
          <div class="dialog-actions">
            <button id="move-cancel" type="button" class="link-btn">Cancel</button>
            <button id="move-save" type="button" class="primary-btn">Move</button>
          </div>
        </form>
      </dialog>

      <main class="main">
        <div id="empty-state" class="empty-state">
          <div class="empty-state-inner">
            <h1 class="hero-wordmark">shruti</h1>
            <p class="hero-tagline">local meeting recorder · transcripts · ai summaries</p>

            <button class="suggestion-card single" id="sg-record">
              <div class="sg-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="3" width="6" height="12" rx="3"/>
                  <path d="M5 11a7 7 0 0 0 14 0"/>
                  <line x1="12" y1="18" x2="12" y2="22"/>
                </svg>
              </div>
              <div class="sg-title">Record a meeting</div>
              <div class="sg-meta">capture mic + system audio</div>
            </button>
          </div>
        </div>

        <div id="meeting-view" class="meeting-view hidden">
          <header class="meeting-header">
            <input
              id="meeting-title"
              class="meeting-title"
              type="text"
              placeholder="Untitled meeting"
            />
            <div class="meeting-meta">
              <span id="meeting-date"></span>
              <span class="dot">·</span>
              <span id="meeting-duration"></span>
              <span class="meta-spacer"></span>
              <button id="resummarize-btn" class="link-btn meta-action" title="Regenerate AI summary">
                <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2v4h-4"/>
                  <path d="M2 14v-4h4"/>
                  <path d="M2.5 7a6 6 0 0 1 10.6-2.5L14 6"/>
                  <path d="M13.5 9a6 6 0 0 1-10.6 2.5L2 10"/>
                </svg>
                Re-summarize
              </button>
              <button id="delete-btn" class="link-btn danger meta-action">Delete</button>
            </div>
          </header>

          <div class="tabs">
            <button class="tab active" data-tab="summary">Summary</button>
            <button class="tab" data-tab="notes">Notes</button>
            <button class="tab" data-tab="transcript">Transcript</button>
          </div>

          <section class="tab-pane active" data-pane="summary">
            <div id="summary-content" class="summary"></div>
          </section>

          <section class="tab-pane" data-pane="notes">
            <textarea
              id="notes-area"
              class="notes-area"
              placeholder="Your notes from this meeting…"
            ></textarea>
            <div class="hint">Notes save automatically.</div>
          </section>

          <section class="tab-pane" data-pane="transcript">
            <div id="transcript-content" class="transcript"></div>
          </section>
        </div>
      </main>
    </div>

    <dialog id="settings-dialog" class="settings-dialog">
      <form method="dialog">
        <h2>Settings</h2>

        <label>
          <span>Theme</span>
          <div class="dropdown" id="theme-dropdown" data-value="light">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-label">Light</span>
              <span class="dropdown-chevron">▾</span>
            </button>
            <div class="dropdown-menu hidden" role="listbox">
              <button type="button" class="dropdown-option" data-value="light">Light</button>
              <button type="button" class="dropdown-option" data-value="dark">Dark</button>
              <button type="button" class="dropdown-option" data-value="system">System</button>
            </div>
          </div>
        </label>

        <label>
          <span>Smallest AI key (STT)</span>
          <input id="smallest-key" type="password" placeholder="sk_..." />
          <small>Used to transcribe recordings. Required to use cloud STT. Leave blank to fall back to local whisper.cpp.</small>
        </label>

        <label>
          <span>OpenRouter key (Summary LLM)</span>
          <input id="openrouter-key" type="password" placeholder="sk-or-..." />
          <small>Used to write meeting summaries. Without this, transcripts are saved but not summarized.</small>
        </label>

        <label>
          <span>Summary model</span>
          <div class="dropdown" id="model-dropdown" data-value="anthropic/claude-haiku-4.5">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-label">Claude Haiku 4.5</span>
              <span class="dropdown-chevron">▾</span>
            </button>
            <div class="dropdown-menu hidden" role="listbox">
              <button type="button" class="dropdown-option" data-value="anthropic/claude-haiku-4.5">
                <span class="opt-title">Claude Haiku 4.5</span>
                <span class="opt-meta">fast + cheap · default</span>
              </button>
              <button type="button" class="dropdown-option" data-value="openai/gpt-5.5">
                <span class="opt-title">GPT-5.5</span>
                <span class="opt-meta">OpenAI's newest</span>
              </button>
              <button type="button" class="dropdown-option" data-value="z-ai/glm-5.1">
                <span class="opt-title">GLM 5.1</span>
                <span class="opt-meta">Z.AI</span>
              </button>
              <button type="button" class="dropdown-option" data-value="minimax/minimax-m2.7">
                <span class="opt-title">Minimax M2.7</span>
                <span class="opt-meta">compact + cheap</span>
              </button>
              <button type="button" class="dropdown-option" data-value="google/gemini-2.5-flash">
                <span class="opt-title">Gemini 2.5 Flash</span>
                <span class="opt-meta">cheapest</span>
              </button>
              <button type="button" class="dropdown-option" data-value="__custom__">
                <span class="opt-title">Custom…</span>
                <span class="opt-meta">paste any OpenRouter slug</span>
              </button>
            </div>
          </div>
          <input id="openrouter-model" type="text" placeholder="provider/model-id" class="hidden" />
          <small>OpenRouter routes summaries to whichever model you pick. All charge per request — see openrouter.ai/models for pricing.</small>
        </label>
        <div class="dialog-actions">
          <button id="settings-cancel" type="button" class="link-btn">Cancel</button>
          <button id="settings-save" type="button" class="primary-btn">Save</button>
        </div>
      </form>
    </dialog>

    <!-- Generic modal — reused for confirm / prompt / alert. -->
    <dialog id="modal" class="modal">
      <div class="modal-body">
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-message" id="modal-message"></p>
        <input id="modal-input" class="modal-input hidden" type="text" />
        <div class="modal-actions">
          <button id="modal-cancel" type="button" class="link-btn">Cancel</button>
          <button id="modal-confirm" type="button" class="primary-btn">OK</button>
        </div>
      </div>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
